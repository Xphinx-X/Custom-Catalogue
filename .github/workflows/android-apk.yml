name: Build APKs

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'reference-repos/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'reference-repos/**'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CustomCatalogue-debug.apk
          ls -lh artifacts/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomCatalogue-debug-apk
          path: artifacts/CustomCatalogue-debug.apk
          retention-days: 14

  build-release-apk:
    name: Build release APK (R8)
    runs-on: ubuntu-latest
    needs: build-debug-apk
    # Run on push / manual dispatch. Skip on PRs to avoid unsigned-release noise.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build release APK with R8
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/CustomCatalogue-release.apk
          ls -lh artifacts/
          ls -lh app/build/outputs/apk/release/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomCatalogue-release-apk
          path: artifacts/CustomCatalogue-release.apk
          retention-days: 30

      - name: ADB install instructions
        run: |
          echo "## Install release on device via adb" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`CustomCatalogue-release-apk\` artifact from this run." >> $GITHUB_STEP_SUMMARY
          echo "2. \`adb devices\` should list your phone." >> $GITHUB_STEP_SUMMARY
          echo "3. Install: \`adb install -r CustomCatalogue-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release is R8-minified + resource-shrunk, signed with the debug key (base setup)." >> $GITHUB_STEP_SUMMARY
